[project]
name = "winnie-backend"
version = "0.1.0"
description = "Winnie: coordination agent for the NJIT WiCS e-board (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "discord-py>=2.7.1",
    "fastapi[standard]>=0.162.7",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "supabase>=2.34.1",
]

[project.optional-dependencies]
agents = ["deepagents>=0.7,<0.8", "langchain-openai>=1,<2", "langchain-google-genai>=4,<5"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# TODO: add "--cov=app --cov-fail-under=80" once there is code to cover.

[tool.ruff]
line-length = 100
target-version = "py313"
