[project]
name = "winnie-meeting-ingest"
version = "0.1.0"
description = "Meeting ingest: audio -> transcript -> summary -> action items -> Supabase Postgres"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "supabase>=2.5",
    "tzdata",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pgserver>=0.1.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real Supabase database (needs SUPABASE_DB_URL; skipped by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # hand-aligned fixtures/tables

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["app"]

[[tool.mypy.overrides]]
module = "app.repository"
warn_return_any = false  # psycopg dict_row rows are dict[str, Any] by construction
