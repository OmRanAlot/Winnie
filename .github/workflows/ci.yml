# CI for every pull request and push to main; CD to Cloud Run + Firebase Hosting on main.
#
# CI jobs use no secrets, so they are safe on pull requests from forks.
# Deploy jobs run only on push to main, after every CI job passes, and only once the repo
# variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT exist (see docs/CI.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_PROJECT: hack-princeton-514716
  GCP_REGION: us-east1
  CLOUD_RUN_SERVICE: api
  FIREBASE_TOOLS_VERSION: 15.36.0

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (lockfile must be up to date)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build

  messaging:
    name: messaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: messaging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: messaging/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  photon-send:
    name: photon-send
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/photon
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/photon/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test send.test.mjs

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build the backend image (not pushed)
        run: docker build --tag winnie-api:ci backend

  deploy-changes:
    name: detect-deploy-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed deploy targets
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git diff --name-only "$BEFORE" "$AFTER" -- backend | grep -q .; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "$AFTER" -- frontend | grep -q .; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && needs.deploy-changes.outputs.backend == 'true'
    needs: [backend, frontend, messaging, photon-send, docker-build, deploy-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Remember the serving revision
        id: previous
        run: |
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT" --format=json | jq -r '.status.traffic[] | select(.percent == 100) | .revisionName')"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      # Keep the current traffic in place while the new image starts and passes a smoke test.
      - name: Deploy candidate to Cloud Run
        run: >
          gcloud run deploy "$CLOUD_RUN_SERVICE" --source backend
          --no-traffic --tag ci-candidate
          --update-env-vars "WINNIE_MESSAGE_MEMORY_ENABLED=${{ vars.WINNIE_MESSAGE_MEMORY_ENABLED || 'true' }}"
          --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet
      - name: Smoke test candidate
        id: candidate
        run: |
          service="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT" --format=json)"
          url="$(echo "$service" | jq -r '.status.traffic[] | select(.tag == "ci-candidate") | .url')"
          revision="$(echo "$service" | jq -r '.status.traffic[] | select(.tag == "ci-candidate") | .revisionName')"
          test -n "$url" && test "$url" != null && test -n "$revision"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/api/health"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Promote tested revision
        id: promote
        run: >
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"
          --to-revisions "${{ steps.candidate.outputs.revision }}=100"
          --remove-tags ci-candidate
          --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet
      - name: Smoke test production
        run: |
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/api/health"
      - name: Roll back failed promotion
        if: failure() && steps.promote.outcome == 'success'
        run: >
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"
          --to-revisions "${{ steps.previous.outputs.revision }}=100"
          --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet
      - name: Remove failed candidate tag
        if: failure() && steps.promote.outcome != 'success'
        run: >
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"
          --remove-tags ci-candidate
          --region "$GCP_REGION" --project "$GCP_PROJECT" --quiet

  deploy-frontend:
    name: deploy-frontend
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && needs.deploy-changes.outputs.frontend == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.messaging.result == 'success' && needs.photon-send.result == 'success' && needs.docker-build.result == 'success' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs: [backend, frontend, messaging, photon-send, docker-build, deploy-changes, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Public by design (shipped to browsers). Never put a secret/service-role key here.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy --only hosting --project "$GCP_PROJECT"
      - name: Smoke test (through the Hosting rewrite to Cloud Run)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "https://${GCP_PROJECT}.web.app/api/health"
